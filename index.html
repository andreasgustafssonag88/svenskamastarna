<!DOCTYPE html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SvenskaMästarna v2</title><link rel="stylesheet" href="css/style.css"></head><body>

<div class="card"><h2>Ordakademin</h2><button onclick="startGame()">Starta</button><div id="question">Välj Starta</div><button id="speakBtn" onclick="speakCurrent()">🔊 Läs upp</button><div id="answers"></div></div>
<div class="card"><h2>SVA-ordhjälp</h2><button onclick="showWord(0)">Demokrati</button><button onclick="showWord(1)">Argument</button><div id="wordhelp"></div></div>
</div><script src="js/app.js"></script></body></html>
